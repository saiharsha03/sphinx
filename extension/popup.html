<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sphinx</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { min-width: 340px; }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  main > section:first-of-type { margin-top: 14px; }
  .item { display: flex; gap: 6px; align-items: center; padding: 10px 12px; min-height: 46px; }
  .item + .item { border-top: 1px solid var(--hair-soft); }
  .item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 14px; }
  .item button { min-height: 32px; padding: 0 14px; font-size: 13px; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 0; }
  .head .label { margin: 0; }
  .head button { min-height: 26px; padding: 0 10px; font-size: 12px; border-color: transparent; }
  .head button:disabled { visibility: hidden; }
  .list:empty { display: none; }
  .list:not(:empty) + .muted { display: none; }
  .item .state { flex: 0 0 auto; font-weight: 500; font-size: 12.5px; color: var(--text2); padding: 0 6px; }
  section + section { margin-top: 14px; }
  .group + .group { margin-top: 10px; }
  #said:empty { display: none; }
  .pair { display: flex; gap: 8px; margin-top: 8px; }
  .pair button { flex: 1; min-height: 40px; font-size: 14px; }
  .foot { text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <div class="wordmark"><svg class="mk" viewBox="0 112 200 76" aria-hidden="true"><path d="M6 184 C26 172 52 168 74 170 L90 150 C94 132 108 120 126 122 C140 124 148 136 146 150 L154 160 C166 162 178 168 188 176 L196 184Z"/><circle class="mk-eye" cx="129" cy="137" r="4"/></svg>Sphinx</div>
  <section id="send">
    <span class="label">To your phone</span>
    <button class="primary wide" id="continue">Open this page on my phone</button>
    <textarea id="note" maxlength="3000" placeholder="A note or some text for the phone" style="margin-top:10px"></textarea>
    <div class="pair">
      <button class="secondary" id="sendNote">Send text</button>
      <button class="secondary" id="pick">Send a file…</button>
      <input type="file" id="file" hidden>
    </div>
    <p class="muted" id="said" style="margin-top:8px"></p>
  </section>
  <section>
    <span class="label">From your phone</span>
    <div class="group">
      <div class="head"><span class="label">Texts</span><button class="text" id="clearTexts">Clear</button></div>
      <div class="list" id="texts"></div>
      <p class="muted pad">No texts or links yet. They stay here until you remove them; nothing opens until you click.</p>
    </div>
    <div class="group">
      <div class="head"><span class="label">Files</span><button class="text" id="clearFiles">Clear</button></div>
      <div class="list" id="files"></div>
      <p class="muted pad">No files yet. A file can be downloaded for about 10 minutes after the phone sent it.</p>
    </div>
  </section>
  <section id="unpaired" hidden>
    <div class="group"><p class="muted pad">Not paired yet. <a href="options.html" target="_blank">Open the options</a> to pair.</p></div>
  </section>
  <p class="muted foot"><a href="options.html" target="_blank">Options</a></p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
